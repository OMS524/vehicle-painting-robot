paint_path:
  surface_extraction:
    # 로컬 작업 좌표계에서 슬라이스를 시작할 방향: top / bottom / left / right
    spline_start_side: top
    # 선택한 시작 방향에서 첫 슬라이스를 배치하기 전 안쪽으로 들어가는 거리 [m]
    spline_start_offset: 0.03
    # 인접한 슬라이스 row 사이 간격 [m]
    spline_spacing: 0.05
    # 각 슬라이스 band에서 raw 점군을 모을 때 쓰는 반두께 [m]
    spline_half_width: 0.005

  correction:
    endpoint:
      # endpoint 추출용 그래프를 만들기 전 점군을 정리할 때 쓰는 양자화 간격 [m]
      quantize_step: 0.001
      # component 그래프 구성 시 각 점이 연결할 최근접 이웃 개수
      graph_neighbor_count: 10
      # 이 arc 길이보다 짧은 component는 노이즈로 보고 버림 [m]
      component_min_arc_length: 0.003

    support:
      # 보정 전에 선택된 upper hull를 다시 샘플링하는 간격 [m]
      support_point_spacing: 0.0025
      # 각 hull 샘플점의 로컬 접선 방향으로 raw 표면 점을 찾을 때 쓰는 탐색 반폭 [m]
      tangent_half_width: 0.0025
      # raw 표면 점과 이 거리보다 멀면 anchor로 취급하지 않음 [m]
      anchor_max_distance: 0.25
      # unsupported 구간 양끝에 추가로 풀어줄 transition 샘플 개수
      transition_count: 4
      # 전체 hull 양끝에서 anchor를 풀어둘 transition 샘플 개수
      endpoint_transition_count: 8

    optimization:
      # 시작점/끝점을 원래 upper hull 끝점 근처에 유지하는 soft 항의 가중치
      lambda_end: 0.01
      # 기준 upper hull 근처에 머물도록 하는 항의 가중치
      lambda_data: 0.1
      # 1차 차분(로컬 흐름 / 간격) 유지 항의 가중치
      lambda_stretch: 1.0
      # 2차 차분 최소화(급격한 꺾임 / 접힘 억제) 항의 가중치
      lambda_bend: 100.0
      # 최적화 수치 안정화를 위한 작은 regularizer
      regularizer: 1.0e-9

  offset:
    # offset 생성 전 corrected row를 다시 샘플링하는 간격 [m]
    offset_point_spacing: 0.025
    # corrected surface path에서 법선 방향으로 떨어질 offset 거리 [m]
    offset_distance: 0.2

  spline:
    # 최종 spline 출력용 재샘플링 간격 [m]
    spline_point_spacing: 0.005
    # 최종 경로 샘플별 time_from_start 계산에 사용할 TCP 목표 속도 [m/s]
    tcp_speed: 0.1
    # 생성된 paint spline 양 끝을 끝 접선 방향으로 직선 연장할 길이 [m]
    endpoint_extension_length: 0.1
    # 분사 T/F 검사 시 TCP position으로부터 분사 방향으로 볼 최대 거리 [m] (권장값: offset_distance + 추가 거리)
    paint_check_distance: 0.45
    # 분사 T/F 검사 시 2D 검사 영역의 반폭 [m]
    paint_check_half_width: 0.005
    # 분사 T/F 검사 시 이 길이보다 짧은 연속 False 구간은 다시 True로 메움 [m]
    paint_min_false_length: 0.5
    # 분사 T/F 검사 시 양옆이 False인 경우, 이 길이보다 짧은 연속 True 구간은 False로 메움 [m]
    paint_min_true_length: 0.005

  structuring:
    # 구조화된 PaintPath의 frame_id
    frame_id: world
    # 최종 path row를 지그재그 방향으로 번갈아 뒤집을지 여부
    raster_zigzag: true
    # 구조화된 PaintPath와 Path별 CSV 파일을 저장할지 여부
    save_csv: true
    # 비워두면 paint_path_planner/csv에 저장
    csv_output_dir: "/home/oms/ros2_ws/src/painting_path_planner/paint_path_planner/csv
"
    # PaintPath 전체 waypoint를 하나로 모아 저장하는 CSV 파일 이름
    paint_path_csv_name: paint_path.csv
    # Path별 CSV 파일 이름 형식. 사용 가능: {path_index}, {path_number}
    path_csv_name_format: path_{path_index:03d}.csv
