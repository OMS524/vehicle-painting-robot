[package]
name = "painting-trajectory-reviewer"
version = "0.1.0"
description = "Offline vehicle painting trajectory review tool"
authors = ["OMS"]
edition = "2021"

[lib]
name = "painting_trajectory_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
