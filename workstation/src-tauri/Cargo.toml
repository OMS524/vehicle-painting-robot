[package]
name = "painting-process-workstation"
version = "0.2.0"
description = "Vehicle painting scan, trajectory generation and editing workstation"
authors = ["OMS"]
edition = "2021"

[lib]
name = "painting_process_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
